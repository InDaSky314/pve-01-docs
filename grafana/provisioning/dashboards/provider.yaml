apiVersion: 1
providers:
  - name: media-core-dashboards
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    # Provisioned dashboards are read-only in the UI by default; allowing
    # updates means edits made in the browser are not silently reverted on
    # the next Grafana restart.
    allowUiUpdates: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false

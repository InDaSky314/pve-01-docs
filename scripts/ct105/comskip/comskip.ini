; comskip.ini — Media-Core DVR post-processing
; Validated 2026-08-15 against a real NFL Network recording (Packers@Steelers):
; 3/3 commercial breaks found, 0 false cuts, verified frame-by-frame.
; Provider re-encode has NO true black frames (ffmpeg blackdetect: zero at
; pix_th 0.15), so brightness thresholds must stay loose and detection multi-
; signal. detect_method 111 = black+logo+scene+resolution+aspect+silence.
detect_method=111
verbose=1
output_edl=1
output_default=0
max_avg_brightness=35
maxbright=10
logo_threshold=0.625
shrink_logo=5
max_commercialbreak=600
min_commercialbreak=20
live_tv=0

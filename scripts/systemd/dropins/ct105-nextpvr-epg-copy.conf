# NextPVR bind-mounts only /config and /buffer, so it cannot read
# /srv/media-core/epg/epg.xml the way Jellyfin can. Keep a copy inside its
# config dir (visible to the container as /config/epg.xml) so the XMLTV
# guide source stays current after each nightly sync.
[Service]
ExecStartPost=/bin/cp /srv/media-core/epg/epg.xml /srv/media-core/nextpvr/config/epg.xml
